services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: creator-agent-postgres
    environment:
      POSTGRES_DB: creator_agent
      POSTGRES_USER: creator_agent
      POSTGRES_PASSWORD: creator_agent
    ports:
      - "5432:5432"
    volumes:
      - creator_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator_agent -d creator_agent"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  creator_agent_pgdata:

